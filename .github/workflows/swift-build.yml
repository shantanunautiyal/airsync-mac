name: macOS Build & Release

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Build AirSync (Self Compiled / Release)
        run: |
          set -o pipefail
          if which xcpretty > /dev/null 2>&1; then
            xcodebuild -project AirSync.xcodeproj -scheme AirSync -configuration "Self Compiled" -destination 'platform=macOS' clean build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" | xcpretty
          else
            xcodebuild -project AirSync.xcodeproj -scheme AirSync -configuration "Self Compiled" -destination 'platform=macOS' clean build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS=""
          fi

      - name: Package App Archive
        id: package_app
        run: |
          mkdir -p release-artifacts
          BUILD_DIR=$(xcodebuild -project AirSync.xcodeproj -scheme AirSync -configuration "Self Compiled" -showBuildSettings | grep -m 1 "TARGET_BUILD_DIR =" | awk -F' = ' '{print $2}')
          APP_PATH="${BUILD_DIR}/AirSync.app"
          
          if [ -d "$APP_PATH" ]; then
            MARKETING_VERSION=$(xcodebuild -project AirSync.xcodeproj -scheme AirSync -configuration "Self Compiled" -showBuildSettings | grep -m 1 "MARKETING_VERSION =" | awk -F' = ' '{print $2}')
            if [ -z "$MARKETING_VERSION" ]; then
              MARKETING_VERSION="4.1.0"
            fi
            
            ZIP_NAME="AirSync-macOS-v${MARKETING_VERSION}.zip"
            cd "${BUILD_DIR}"
            zip -r -y "${GITHUB_WORKSPACE}/release-artifacts/${ZIP_NAME}" AirSync.app
            cd "${GITHUB_WORKSPACE}"
            
            echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT
            echo "version_name=${MARKETING_VERSION}" >> $GITHUB_OUTPUT
            echo "zip_path=release-artifacts/${ZIP_NAME}" >> $GITHUB_OUTPUT
          else
            echo "ERROR: AirSync.app not found at ${APP_PATH}"
            exit 1
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-macOS
          path: release-artifacts/

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-{1}', steps.package_app.outputs.version_name, github.run_number) }}
          name: ${{ format('AirSync macOS v{0} (Build {1})', steps.package_app.outputs.version_name, github.run_number) }}
          body: |
            ## Automated AirSync macOS Release
            
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Build**: `${{ github.run_number }}`
            
            ### Included Artifacts
            - `${{ steps.package_app.outputs.zip_name }}`
          draft: false
          prerelease: false
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
